name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.18.0-nvda.1"
        required: true
  push:
    tags: ["v*-nvda.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-nvda\.[0-9]+$ ]]; then
            echo "Invalid Windows/NVDA release tag: $RELEASE_TAG" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Prepare release names
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          if [[ "$(git rev-parse HEAD)" != "$tag_commit" ]]; then
            echo "Checkout does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi
          msi_version="${RELEASE_TAG#v}"
          msi_version="${msi_version%%-*}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "MSI_VERSION=$msi_version" >> "$GITHUB_ENV"
          echo "ASSET_PREFIX=Alacritty-NVDA-Windows-$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Upload portable executable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp ./target/release/alacritty.exe "./${ASSET_PREFIX}-portable.exe"
          ./.github/workflows/upload_asset.sh \
            "./${ASSET_PREFIX}-portable.exe" "$GITHUB_TOKEN"
      - name: Install WiX
        run: dotnet tool install --global wix --version 4.0.5
      - name: Create msi installer
        run: |
          wix extension add WixToolset.UI.wixext/4.0.5 WixToolset.Util.wixext/4.0.5
          wix build -arch "x64" -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext \
            -d ProductVersion="$MSI_VERSION" \
            -out "./${ASSET_PREFIX}-installer.msi" "alacritty/windows/wix/alacritty.wxs"
      - name: Upload msi installer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/workflows/upload_asset.sh \
            "./${ASSET_PREFIX}-installer.msi" "$GITHUB_TOKEN"
      - name: Create checksums
        run: |
          sha256sum "./${ASSET_PREFIX}-portable.exe" "./${ASSET_PREFIX}-installer.msi" \
            > "./${ASSET_PREFIX}-checksums.txt"
      - name: Upload checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/workflows/upload_asset.sh \
            "./${ASSET_PREFIX}-checksums.txt" "$GITHUB_TOKEN"
