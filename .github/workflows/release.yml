name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+-nvda.[0-9]+*"]

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
      - name: Prepare release names
        run: |
          tag="${GITHUB_REF_NAME}"
          msi_version="${tag#v}"
          msi_version="${msi_version%%-*}"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "MSI_VERSION=$msi_version" >> "$GITHUB_ENV"
          echo "ASSET_PREFIX=Alacritty-NVDA-Windows-$tag" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Upload portable executable
        run: |
          cp ./target/release/alacritty.exe "./${ASSET_PREFIX}-portable.exe"
          ./.github/workflows/upload_asset.sh \
            "./${ASSET_PREFIX}-portable.exe" $GITHUB_TOKEN
      - name: Install WiX
        run: dotnet tool install --global wix --version 4.0.5
      - name: Create msi installer
        run: |
          wix extension add WixToolset.UI.wixext/4.0.5 WixToolset.Util.wixext/4.0.5
          wix build -arch "x64" -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext \
            -d ProductVersion="$MSI_VERSION" \
            -out "./${ASSET_PREFIX}-installer.msi" "alacritty/windows/wix/alacritty.wxs"
      - name: Upload msi installer
        run: |
          ./.github/workflows/upload_asset.sh \
            "./${ASSET_PREFIX}-installer.msi" $GITHUB_TOKEN
      - name: Create checksums
        run: |
          sha256sum "./${ASSET_PREFIX}-portable.exe" "./${ASSET_PREFIX}-installer.msi" \
            > "./${ASSET_PREFIX}-checksums.txt"
      - name: Upload checksums
        run: |
          ./.github/workflows/upload_asset.sh \
            "./${ASSET_PREFIX}-checksums.txt" $GITHUB_TOKEN
